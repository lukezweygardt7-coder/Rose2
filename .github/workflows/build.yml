name: Build Rose Companion

'on':
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Forge 1.12.2 / ForgeGradle 5.1 / Java 8
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 7.6.4
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-7.6.4/bin" >> "$GITHUB_PATH"

      - name: Find or extract Rose source project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="$(find . -type f -name build.gradle -not -path './.git/*' -not -path '*/.gradle/*' -not -path '*/build/*' -print -quit || true)"
          if [[ -z "$BUILD_FILE" ]]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname 'RoseCompanion-Forge1122-GitHubReady-Updated.zip' -print -quit || true)"
            if [[ -z "$ZIP_FILE" ]]; then
              echo '::error::Could not find the Rose source ZIP.'
              find . -maxdepth 3 -type f -print | sort
              exit 1
            fi
            mkdir -p .rose-source
            unzip -q "$ZIP_FILE" -d .rose-source
            BUILD_FILE="$(find .rose-source -type f -name build.gradle -print -quit || true)"
          fi
          if [[ -z "$BUILD_FILE" ]]; then
            echo '::error::Could not locate build.gradle.'
            exit 1
          fi
          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          PROJECT_DIR="${PROJECT_DIR#./}"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify project and toolchain
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version

          test -f build.gradle
          test -f settings.gradle
          test -f src/main/resources/mcmod.info
          test -f src/main/resources/assets/rosecompanion/textures/entity/rose.png
          test -f src/main/resources/assets/rosecompanion/textures/items/rose_whistle.png
          test -f src/main/java/com/rosecompanion/RoseCompanion.java
          test -f src/main/java/com/rosecompanion/entity/EntityRoseDog.java

          grep -q "ForgeGradle.*5.1.77" build.gradle
          grep -q "1.12.2-14.23.5.2864" build.gradle

      - name: Build and reobfuscate Rose
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon --stacktrace clean build

      - name: Verify JAR contents
        id: jar
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          JAR_FILE="$(find build/libs -maxdepth 1 -type f -name 'RoseCompanion-*.jar' ! -name '*-sources.jar' -print -quit)"

          test -n "$JAR_FILE"
          test -s "$JAR_FILE"

          jar tf "$JAR_FILE" > jar-contents.txt

          grep -Fxq mcmod.info jar-contents.txt
          grep -Fxq com/rosecompanion/RoseCompanion.class jar-contents.txt
          grep -Fxq com/rosecompanion/entity/EntityRoseDog.class jar-contents.txt
          grep -Fxq assets/rosecompanion/textures/entity/rose.png jar-contents.txt
          grep -Fxq assets/rosecompanion/textures/items/rose_whistle.png jar-contents.txt

          echo "jar_file=$JAR_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: RoseCompanion-Forge-1.12.2
          path: ${{ steps.project.outputs.project_dir }}/${{ steps.jar.outputs.jar_file }}
          if-no-files-found: error
          retention-days: 14
