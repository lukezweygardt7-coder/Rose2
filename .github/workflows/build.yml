name: Build Rose Companion

'on':
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Forge 1.12.2 / Java 8
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Find or extract Rose project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="$(find . -type f -name build.gradle \
            -not -path './.git/*' \
            -not -path './.gradle/*' \
            -not -path '*/build/*' \
            -print -quit || true)"

          if [[ -z "$BUILD_FILE" ]]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' \
              -not -path './.git/*' -print -quit || true)"

            if [[ -z "$ZIP_FILE" ]]; then
              echo "::error::No Rose source ZIP found."
              find . -maxdepth 4 -type f -print
              exit 1
            fi

            echo "Extracting: $ZIP_FILE"
            unzip -t "$ZIP_FILE"

            mkdir -p .rose-build-source
            unzip -q "$ZIP_FILE" -d .rose-build-source

            BUILD_FILE="$(find .rose-build-source \
              -type f -name build.gradle \
              -print -quit || true)"
          fi

          if [[ -z "$BUILD_FILE" ]]; then
            echo "::error::Could not locate build.gradle after extraction."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "Found project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Install Gradle 4.10.3
        run: |
          curl -fsSL \
            https://services.gradle.org/distributions/gradle-4.10.3-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-4.10.3/bin" >> "$GITHUB_PATH"

      - name: Verify project files
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          java -version
          gradle --version

          test -f build.gradle
          test -f settings.gradle
          test -f gradle.properties
          test -f src/main/resources/mcmod.info
          test -f src/main/resources/assets/rosecompanion/textures/entity/rose.png
          test -f src/main/resources/assets/rosecompanion/textures/items/rose_whistle.png
          test -f src/main/java/com/rosecompanion/RoseCompanion.java
          test -f src/main/java/com/rosecompanion/entity/EntityRoseDog.java

          echo "All required project files found!"

      - name: Build Rose Companion
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle clean setupCIWorkspace build \
            --no-daemon --stacktrace

      - name: Verify mod JAR
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          JAR="build/libs/RoseCompanion-1.0.0.jar"

          test -s "$JAR"

          jar tf "$JAR" > jar-contents.txt

          grep -Fxq "mcmod.info" jar-contents.txt
          grep -Fxq "com/rosecompanion/RoseCompanion.class" jar-contents.txt
          grep -Fxq "com/rosecompanion/entity/EntityRoseDog.class" jar-contents.txt
          grep -Fxq "assets/rosecompanion/textures/entity/rose.png" jar-contents.txt

          echo "Rose JAR verification successful!"

      - name: Upload Rose Companion
        uses: actions/upload-artifact@v4
        with:
          name: RoseCompanion-Forge-1.12.2
          path: ${{ steps.project.outputs.project_dir }}/build/libs/RoseCompanion-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
